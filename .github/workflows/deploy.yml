name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          mkdir -p tmp
          for z in *.zip; do unzip -q -o "$z" -d tmp; done
          d=$(dirname "$(find tmp -name index.html | head -1)")
          mv "$d" site
          echo "beefandbuns.rayantriki.com" > site/CNAME
          ls -R site | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
